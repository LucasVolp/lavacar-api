services:
  postgres:
    image: postgres:15
    container_name: lavacar_postgres
    env_file:
      - ./.env
    ports:
      - "3002:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lavacar_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lavacar_backend
    entrypoint: ["/app/entrypoint.sh"]
    env_file:
      - ./.env
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - postgres
    networks:
      - lavacar_network

volumes:
  postgres_data:

networks:
  lavacar_network:
